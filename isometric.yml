name: Generate Isometric Contributions

on:
  # Berjalan otomatis setiap 24 jam
  schedule:
    - cron: "0 0 * * *"
  # Memungkinkan dijalankan manual dari tab Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: hamidasonia
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year # Bisa diganti 'full-year'
